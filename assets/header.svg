<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340">
  <defs>
    <radialGradient id="ember" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fc6b2f" stop-opacity="0.38"/>
      <stop offset="0.45" stop-color="#dc2626" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#dc2626" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.45" r="0.75">
      <stop offset="0.35" stop-color="#111111" stop-opacity="0"/>
      <stop offset="1" stop-color="#050505" stop-opacity="1"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="340" rx="18" fill="#111111"/>
  <ellipse cx="600" cy="170" rx="360" ry="200" fill="url(#ember)">
    <animate attributeName="opacity" values=".75;1;.75" dur="5s" repeatCount="indefinite"/>
  </ellipse>
  <rect width="1200" height="340" rx="18" fill="url(#vignette)"/>

  <!-- dust -->
  <g fill="#fc6b2f">
    <circle cx="140" cy="60" r="1.6" opacity=".6"><animate attributeName="cy" values="60;48;60" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="1040" cy="90" r="1.4" opacity=".5"><animate attributeName="cy" values="90;78;90" dur="7s" repeatCount="indefinite"/></circle>
    <circle cx="980" cy="270" r="1.8" opacity=".5"><animate attributeName="cy" values="270;258;270" dur="5.5s" repeatCount="indefinite"/></circle>
  </g>
  <g fill="#ffffff" opacity=".25">
    <circle cx="300" cy="280" r="1.2"/><circle cx="860" cy="40" r="1"/><circle cx="1120" cy="200" r="1.3"/><circle cx="70" cy="210" r="1"/>
  </g>

  <!-- tag line -->
  <circle cx="74" cy="44" r="4" fill="#dc2626"><animate attributeName="opacity" values="1;.3;1" dur="1.6s" repeatCount="indefinite"/></circle>
  <text x="88" y="49" font-family="Helvetica, Arial, sans-serif" font-size="13" letter-spacing="3" fill="#b5b5b5">SHIPPING IDEAS INTO REALITY.</text>
  <text x="1130" y="49" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#f2f2f2">S<tspan fill="#dc2626">H</tspan><tspan fill="#dc2626">.</tspan></text>

  <!-- HARDHIK, thin outer letters and heavy centre letters like the portfolio hero -->
  <g font-family="'Arial Narrow', 'Helvetica Neue', Arial, sans-serif" fill="#ebe7e4" text-anchor="middle">
    <text x="318" y="232" font-size="150" font-weight="400" fill="none" stroke="#ebe7e4" stroke-width="1.6" opacity=".9">H</text>
    <text x="410" y="232" font-size="150" font-weight="400" fill="none" stroke="#ebe7e4" stroke-width="2" opacity=".92">A</text>
    <text x="520" y="232" font-size="160" font-weight="900">R</text>
    <text x="650" y="232" font-size="170" font-weight="900">D</text>
    <text x="772" y="232" font-size="150" font-weight="400" fill="none" stroke="#ebe7e4" stroke-width="2.4">H</text>
    <text x="852" y="232" font-size="150" font-weight="400" fill="none" stroke="#ebe7e4" stroke-width="1.6" opacity=".9">I</text>
    <text x="912" y="232" font-size="150" font-weight="400" fill="none" stroke="#ebe7e4" stroke-width="1.6" opacity=".85">K</text>
  </g>
  <text x="600" y="180" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="800" letter-spacing="5" fill="#dc2626">SYSTEMS · SDR · SCIENTIFIC ML · AGENTS</text>

  <text x="600" y="300" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#b5b5b5">Sai Hardhik Reddy — systems and ML engineer building radios, PINNs and autonomous agents from first principles</text>
</svg>
